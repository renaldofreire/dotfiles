# i3status configuration
# Migrated from Qtile widgets configuration
# Colors match monochrome_slate theme

general {
    colors = true
    interval = 1
    color_good = "#9ca3af"
    color_degraded = "#9ca3af"
    color_bad = "#ef4444"
}

order += "cpu_usage"
order += "memory"
order += "volume"
order += "time"

cpu_usage {
    format = "󰻠 %usage%"
}

memory {
    format = "󰍛 %used/%total GB"
}

volume master {
    format = "󰕾 %volume"
    format_muted = "󰖁 muted"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

time {
    format = " %a, %d/%m - %H:%M"
}