###########################################
# Configuração Minimalista Picom (Performance)
###########################################

##################################
# Backend e Renderização GLX
##################################

# Usar GLX para aceleração de hardware
backend = "glx";

# Otimizações de OpenGL e compatibilidade
xrender-sync-fence = true;

##################################
# VSync e Performance Base
##################################

vsync = true;
use-damage = true;

# Desabilita o compositor ao usar tela cheia (Garante FPS nativo em vídeos/jogos)
unredir-if-possible = true;

##################################
# Visual (Sólido e Rápido)
##################################

# Sem sombras, sem efeitos de desvanecimento, sem transparência
shadow = false;
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Removemos checagens dinâmicas redundantes como detect-client-opacity
# para evitar que a CPU perca tempo inspecionando janelas.

##################################
# Tipos de Janela
##################################

wintypes:
{
  # Omitimos regras de sombra redundantes pois 'shadow = false' é global.
  # Garantir opacidade total padrão
  tooltip = { opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
