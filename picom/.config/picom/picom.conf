###########################################
# Configuração Estável Picom (AMD Radeon / X11)
###########################################

##################################
# Backend e Renderização GLX
##################################

backend = "glx";
xrender-sync-fence = true;

##################################
# VSync e Performance Base
##################################

vsync = true;
use-damage = false;

# Desativado para evitar flashes pretos ao entrar/sair de tela cheia no mpv/vlc
unredir-if-possible = false;

##################################
# Visual (Sólido e Rápido)
##################################

shadow = false;
fading = false;
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

##################################
# Tipos de Janela
##################################

wintypes:
{
  tooltip = { opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
