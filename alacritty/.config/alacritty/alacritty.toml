[colors.primary]
background = "#212121"
foreground = "#f8f8f2"
dim_foreground = "#c0c0bb"
bright_foreground = "#e9e9e3"

[colors.cursor]
text = "#282828"
cursor = "#eceff4"

[colors.selection]
text = "#545454"
background = "#f8f8f2"

[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#ffcb6b"
blue = "#82aaff"
magenta = "#c792ea"
cyan = "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#545454"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffcb6b"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#f8f8f2"

[colors.dim]
black = "#1b1c24"
red = "#d14646"
green = "#42cd65"
yellow = "#d1a658"
blue = "#6b8bd1"
magenta = "#a378c0"
cyan = "#72bfcf"
white = "#cbcbc6"

[[colors.indexed_colors]]
index = 16
color = "#ff9764"

[[colors.indexed_colors]]
index = 17
color = "#d3877d"

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor.style]
blinking = "On"
shape = "Block"

[cursor.vi_mode_style]
shape = "Beam"

[env]
TERM = "xterm-256color"

[general]
live_config_reload = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/zsh"

[window]
blur = false
decorations = "buttonless"
dynamic_padding = false
opacity = 1.0

[window.padding]
x = 12
y = 0
