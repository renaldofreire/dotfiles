[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#9ea5bc"
bright_foreground = "#d6e0ff"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#ffa5c2"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#9fc9ff"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f7aec2"
green = "#c2ecbf"
yellow = "#fcd682"
blue = "#aeccfc"
magenta = "#f398da"
cyan = "#b1eae1"
white = "#a6adc8"

[colors.dim]
black = "#393a4a"
red = "#d1879f"
green = "#88ba84"
yellow = "#ccb990"
blue = "#82a5d1"
magenta = "#c99fbd"
cyan = "#79b9af"
white = "#999fb6"

[[colors.indexed_colors]]
index = 16
color = "#fdc4b9"

[[colors.indexed_colors]]
index = 17
color = "#deb3ce"

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor.style]
blinking = "On"
shape = "Block"

[cursor.vi_mode_style]
shape = "Beam"

[env]
TERM = "xterm-256color"

[general]
live_config_reload = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/zsh"

[window]
blur = false
decorations = "buttonless"
dynamic_padding = false
opacity = 1.0

[window.padding]
x = 12
y = 0
