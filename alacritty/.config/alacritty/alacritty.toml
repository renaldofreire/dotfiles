[colors.primary]
background = "#212121"
foreground = "#d0d0d0"
dim_foreground = "#989898"
bright_foreground = "#dfdfdf"

[colors.cursor]
text = "#151515"
cursor = "#d0d0d0"

[colors.selection]
text = "#d0d0d0"
background = "#303030"

[colors.normal]
black = "#151515"
red = "#ac4142"
green = "#7e8e50"
yellow = "#e5b567"
blue = "#6c99bb"
magenta = "#9f4e85"
cyan = "#7dd6cf"
white = "#d0d0d0"

[colors.bright]
black = "#505050"
red = "#ac4142"
green = "#7e8e50"
yellow = "#e5b567"
blue = "#6c99bb"
magenta = "#9f4e85"
cyan = "#7dd6cf"
white = "#f5f5f5"

[colors.dim]
black = "#111111"
red = "#8d3536"
green = "#677442"
yellow = "#bc9454"
blue = "#597d99"
magenta = "#82406d"
cyan = "#67afaa"
white = "#ababab"

[[colors.indexed_colors]]
index = 16
color = "#ca7c54"

[[colors.indexed_colors]]
index = 17
color = "#97605d"

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor.style]
blinking = "On"
shape = "Block"

[cursor.vi_mode_style]
shape = "Beam"

[env]
TERM = "xterm-256color"

[general]
live_config_reload = true

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/zsh"

[window]
blur = false
decorations = "buttonless"
dynamic_padding = false
opacity = 1.0

[window.padding]
x = 12
y = 0
